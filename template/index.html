<!DOCTYPE html>
<html>
<head>
    <title>Iris Predictor</title>
</head>
<body>
    <h2>Enter Features</h2>
    <form method="POST" action="/predict">
        <label>Sepal Length:</label><input type="text" name="sl"><br>
        <label>Sepal Width:</label><input type="text" name="sw"><br>
        <label>Petal Length:</label><input type="text" name="pl"><br>
        <label>Petal Width:</label><input type="text" name="pw"><br>
        <input type="submit" value="Predict">
    </form>
    <h3>{{ prediction_text }}</h3>
</body>
</html>
